[project]
name = "incident-copilot"
version = "0.1.0"
description = "Agentic root-cause analysis for software and data pipelines"
requires-python = ">=3.10"
dependencies = []   # the simulator, detector, tools and knowledge-base wrapper use only the standard library

[project.optional-dependencies]
agent = ["langgraph>=0.2"]
api = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
